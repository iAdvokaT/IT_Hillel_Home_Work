<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="./css/style2.css">
</head>
<body>
    <div class="menu">
        <a href="#" class="menu-item active">All Plants</a>
        <a href="#" class="menu-item">New Arrivals</a>
        <a href="#" class="menu-item">Sale</a>
    </div>
    
    <div class="product-grid">
        <!-- Карточка товара 1 -->
        <div class="product-card">
            <img src="plant1.jpg" alt="Barberton Daisy" class="product-image">
            <h3 class="product-name">Barberton Daisy</h3>
            <p class="product-price">$119.00</p>
        </div>
    
        <!-- Карточка товара 2 с эффектом hover -->
        <div class="product-card hover-card">
            <img src="plant2.jpg" alt="Angel Wing Begonia" class="product-image">
            <h3 class="product-name">Angel Wing Begonia</h3>
            <p class="product-price">$169.00</p>
            <div class="hover-icons">
                <span class="icon-cart">🛒</span>
                <span class="icon-heart">❤️</span>
                <span class="icon-search">🔍</span>
            </div>
        </div>
    
        <!-- Карточка товара 3 с ярлыком скидки -->
        <div class="product-card">
            <div class="discount-label">13% OFF</div>
            <img src="plant3.jpg" alt="African Violet" class="product-image">
            <h3 class="product-name">African Violet</h3>
            <p class="product-price">$199.00 <span class="old-price">$229.00</span></p>
        </div>
    </div>
</body>
</html>
